[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-tools",
    "crates/harness-session",
    "crates/harness-tui",
    "crates/harness-server",
    "crates/harness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/masse"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
chrono = "0.4"
libc = "0.2"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"

[profile.release]
lto = "thin"
strip = true
